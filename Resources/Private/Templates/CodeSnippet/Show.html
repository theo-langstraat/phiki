<f:layout name="Default" />

<f:section name="Main">
    <div class="code-snippet-wrapper" id="snippet-{uid}">

        <f:if condition="{settings.useDefaultFeaturesGlobally}">

            <f:then>
                <f:if condition="{settings.defShowLanguage} || {settings.defCopyButton}">
                    <div class="code-snippet-header">

                        <f:if condition="{settings.defShowLanguage}">
                            <span class="language-badge">{language}</span>
                        </f:if>

                        <div class="snippet-actions">

                            <f:if condition="{settings.defCopyButton}">
                                <button class="copy-btn" data-target="snippet-{uid}">
                                    <svg class="copy-icon" viewBox="0 0 16 16" width="14" height="14">
                                        <path fill="currentColor"
                                            d="M4 4h7v9H4z M6 2h7v9h-1V3H6z"/>
                                    </svg>
                                </button>
                                <button class="expand-btn" data-target="snippet-{uid}">
                                    <svg class="expand-icon" viewBox="0 0 16 16" width="14" height="14">
                                        <path fill="currentColor" d="M4 6l4 4 4-4z"/>
                                    </svg>
                                </button>

                            </f:if>
                        </div>

                    </div>
                </f:if>
            </f:then>

            <f:else>
                <f:if condition="{settings.showLanguage} || {settings.copyButton}">
                    <div class="code-snippet-header">

                        <f:if condition="{settings.showLanguage}">
                            <span class="language-badge">{language}</span>
                        </f:if>

                        <div class="snippet-actions">

                            <f:if condition="{settings.copyButton}">
                                <button class="copy-btn" data-target="snippet-{uid}">
                                    <svg class="copy-icon" viewBox="0 0 16 16" width="14" height="14">
                                        <path fill="currentColor"
                                            d="M4 4h7v9H4z M6 2h7v9h-1V3H6z"/>
                                    </svg>
                                </button>
                                <button class="expand-btn" data-target="snippet-{uid}">
                                    <svg class="expand-icon" viewBox="0 0 16 16" width="14" height="14">
                                        <path fill="currentColor" d="M4 6l4 4 4-4z"/>
                                    </svg>
                                </button>

                            </f:if>
                        </div>

                    </div>
                </f:if>
            </f:else>
        </f:if>

        <div class="code-snippet-body">
            {snippet -> f:format.raw()}
        </div>
    </div>
</f:section>

<f:layout name="Default" />
